<div class="app-shell" [class.sidebar-open]="sidebarOpen()">

  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff8c42" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">VOXMETRIK</span>
        <span class="brand-version">v2.0</span>
      </div>
      <button class="sidebar-close-btn" (click)="closeSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">MENÚ</span>
      @for (item of navItems; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" [innerHTML]="item.icon"></span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-indicator"></span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">{{ userInitial() }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName() }}</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
    </div>
  </aside>

  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <div class="main-content">
    <header class="topbar">
      <button class="menu-btn" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-right">
        <div class="status-dot" title="Backend conectado"></div>
        <span class="status-label">API Live</span>
        <div class="topbar-user">{{ userInitial() }}</div>
      </div>
    </header>

    <main class="page-content">
      @if (loading.isLoading()) {
        <div class="global-loader"><div class="loader-bar"></div></div>
      }
      <router-outlet />
    </main>
  </div>
</div>
