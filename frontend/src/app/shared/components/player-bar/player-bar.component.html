<footer class="player-bar" [class.has-track]="player.currentTrack()">
  <div class="player-progress-wrap" (click)="onProgressClick($event)">
    <div class="player-progress-fill" [style.width.%]="player.progressPct()"></div>
  </div>

  <div class="player-inner">
    <div class="player-track">
      @if (player.currentTrack(); as t) {
        <button type="button" class="cover-btn" (click)="player.toggle()" [style.background]="t.coverGradient">
          @if (player.isPlaying()) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          }
        </button>
        <div class="track-meta">
          <span class="track-title">{{ t.title }}</span>
          <span class="track-artist">{{ t.artist }}</span>
        </div>
        @if (t.explicit) { <span class="explicit-badge">E</span> }
      } @else {
        <div class="track-meta muted">
          <span class="track-title">Selecciona una canción</span>
          <span class="track-artist">Audio demo VOXMETRIK</span>
        </div>
      }
    </div>

    <div class="player-controls">
      <button type="button" class="ctrl-btn sm" [class.active]="player.shuffle()" (click)="player.toggleShuffle()" title="Aleatorio">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button type="button" class="ctrl-btn" (click)="player.previous()" title="Anterior">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="ctrl-btn play-btn" (click)="player.toggle()" [disabled]="!player.currentTrack()">
        @if (player.isPlaying()) {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        } @else {
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        }
      </button>
      <button type="button" class="ctrl-btn" (click)="player.next()" title="Siguiente">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="button" class="ctrl-btn sm" [class.active]="player.repeat()" (click)="player.toggleRepeat()" title="Repetir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <div class="time-row">
        <span class="mono">{{ player.formatTime(player.currentTime()) }}</span>
        <span class="sep">/</span>
        <span class="mono">{{ player.formatTime(player.duration()) }}</span>
      </div>
    </div>

    <div class="player-extra">
      @if (player.queue().length > 1) {
        <div class="queue-pill" title="Cola de reproducción">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          {{ player.queue().length }}
        </div>
      }
      <div class="volume-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <input type="range" min="0" max="1" step="0.01" [value]="player.volume()" (input)="onVolumeInput($event)" class="volume-slider" />
      </div>
    </div>
  </div>
</footer>
