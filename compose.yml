# ── VOXMETRIKS — Compose canónico (fase 042) ─────────────────────────────────
#
#   docker compose up --build
#
# Servicios mínimos: frontend (Nginx + SPA) + backend (FastAPI + DuckDB).
# DuckDB NO es un contenedor: es un archivo bajo data/ montado en el backend.
#
# Docker no se ejecutó en la fase 042 (runtime pendiente). Validación: estática.
#
# Puertos (override):
#   VOXMETRIKS_FRONTEND_PORT  (default 8080)
#   VOXMETRIKS_BACKEND_PORT   (default 8000) — diagnóstico; el navegador usa Nginx /api/

name: voxmetriks

services:

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: runtime
    image: voxmetriks-backend:local
    restart: unless-stopped
    # Variables: Compose carga `.env` de la raíz para interpolación ${...}.
    # No montar `.env` como volumen; no copiar secretos a la imagen.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DB_PATH: /app/data/warehouse/voxmetrik.duckdb
      # Arranque predecible: warehouse montado desde el host; ETL no en boot.
      RUN_ETL_ON_BOOT: ${RUN_ETL_ON_BOOT:-never}
      PYTHONPATH: /app/backend:/app
      HOST: 0.0.0.0
      PORT: "8000"
      RELOAD: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Con proxy Nginx same-origin, CORS es secundario; se mantiene para :8000 directo.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
    volumes:
      # Persistencia DuckDB + capas Parquet (rw: DuckDB escribe; Parquet normalmente solo lectura lógica)
      - ./data:/app/data
    ports:
      - "${VOXMETRIKS_BACKEND_PORT:-8000}:8000"
    networks:
      - voxmetriks
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: voxmetriks-frontend:local
    restart: unless-stopped
    ports:
      - "${VOXMETRIKS_FRONTEND_PORT:-8080}:80"
    networks:
      - voxmetriks
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  voxmetriks:
    driver: bridge
