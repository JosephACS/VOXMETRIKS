@if (state(); as s) {
  <div
    class="modal-backdrop"
    role="presentation"
    (click)="onBackdropClick()"
  >
    <div
      #dialogPanel
      class="modal confirm-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="messageId"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <div class="modal-header">
        <h3
          [id]="titleId"
          class="modal-title"
          [class.modal-title-danger]="s.danger"
        >{{ s.title }}</h3>
        <button
          type="button"
          class="modal-close"
          (click)="onCancel()"
          [attr.aria-label]="closeLabel()"
        >✕</button>
      </div>
      <div class="modal-body">
        <p [id]="messageId" class="delete-confirm-text">{{ s.message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="onCancel()">{{ s.cancelLabel }}</button>
        <button
          type="button"
          [class.btn-danger]="s.danger"
          [class.btn-primary]="!s.danger"
          (click)="onConfirm()"
        >{{ s.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
