<section class="table-widget" data-testid="table-widget">
  @if (title()) {
    <header class="table-widget__header">
      <h3>{{ title() }}</h3>
    </header>
  }

  <div class="table-widget__scroll">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSort($event)" class="table-widget__table">
      @for (col of columns(); track col.key) {
        <ng-container [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef mat-sort-header [class.num]="col.align === 'right'">
            {{ col.header }}
          </th>
          <td mat-cell *matCellDef="let row" [class.num]="col.align === 'right'">
            @switch (col.format) {
              @case ('number') {
                {{ cellValue(row, col) | number }}
              }
              @case ('percent') {
                {{ cellValue(row, col) | number:'1.1-1' }}%
              }
              @default {
                {{ cellValue(row, col) }}
              }
            }
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()" data-testid="table-row"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="sortedRows().length"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [hidePageSize]="true"
    (page)="onPage($event)"
  />
</section>
