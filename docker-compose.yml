# ── Voxmetriks — docker-compose ───────────────────────────────────────────────
#
# Orden de arranque (primera vez):
#   pocketbase  → sirve el dataset (~100k) desde ./pocketbase/pb_data
#   pipeline    → espera a PocketBase, corre el ELT y construye el DuckDB
#   api         → arranca cuando el pipeline termina con éxito (P7: ELT-before-API)
#   frontend    → nginx sirve la SPA y hace proxy /api → api
#
#   docker compose up --build               # primera vez (todo)
#   docker compose up -d pocketbase api frontend   # sin re-correr el pipeline
#   docker compose run --rm pipeline        # re-ejecutar el ELT manualmente

services:

  # ── PocketBase — fuente del dataset (100k) ──────────────────────────────────
  pocketbase:
    image: spectado/pocketbase:latest
    ports:
      - "8090:80"
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data           # dataset + superuser ya creados
      - ./pocketbase/pb_migrations:/pb/pb_migrations
    networks: [voxmetrik]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── ELT Pipeline (job de una sola corrida) ──────────────────────────────────
  pipeline:
    build:
      context: .
      target: runtime
    image: voxmetrik:latest
    working_dir: /app
    command: python elt/pipelines/elt_pipeline.py
    env_file: .env
    environment:
      POCKETBASE_URL: http://pocketbase
      DB_PATH: /app/data/warehouse/voxmetrik.duckdb
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    networks: [voxmetrik]
    restart: "no"
    depends_on:
      pocketbase:
        condition: service_healthy

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    image: voxmetrik:latest
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --log-level info
    env_file: .env
    environment:
      DB_PATH: /app/data/warehouse/voxmetrik.duckdb
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    networks: [voxmetrik]
    restart: unless-stopped
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (Angular + nginx con proxy /api) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: voxmetrik-frontend:latest
    ports:
      - "8080:80"
    networks: [voxmetrik]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

# ── Volúmenes ─────────────────────────────────────────────────────────────────
# ./data se monta en pipeline y api (bronze/silver/gold + DuckDB del host).

# ── Red interna ───────────────────────────────────────────────────────────────
networks:
  voxmetrik:
    driver: bridge
